AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: F1 Telemetry - SAM Application

Parameters:
  TableName:
    Type: String
    Default: F1Telemetry
  DynamoEndpoint:
    Type: String
    Default: http://host.docker.internal:4566
  SqsEndpoint:
    Type: String
    Default: http://host.docker.internal:4566

Globals:
  Function:
    Runtime: python3.13
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref TableName
        DYNAMODB_ENDPOINT: !Ref DynamoEndpoint
        AWS_ACCESS_KEY_ID: local
        AWS_SECRET_ACCESS_KEY: local
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowMethods: "'GET,POST,OPTIONS'"

Resources:
  IngestSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: IngestSession
      Handler: handler.handler
      CodeUri: functions/ingest-session/
      Events:
        Api:
          Type: Api
          Properties:
            Path: /sessions/{session_key}/ingest
            Method: POST
        ApiOptions:
          Type: Api
          Properties:
            Path: /sessions/{session_key}/ingest
            Method: OPTIONS

  ListSessionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ListSessions
      Handler: handler.handler
      CodeUri: functions/list-sessions/
      Events:
        Api:
          Type: Api
          Properties:
            Path: /sessions
            Method: GET
        ApiOptions:
          Type: Api
          Properties:
            Path: /sessions
            Method: OPTIONS

  ListDriversFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ListDrivers
      Handler: handler.handler
      CodeUri: functions/list-drivers/
      Events:
        Api:
          Type: Api
          Properties:
            Path: /sessions/{session_key}/drivers
            Method: GET
        ApiOptions:
          Type: Api
          Properties:
            Path: /sessions/{session_key}/drivers
            Method: OPTIONS

  DriverSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DriverSummary
      Handler: handler.handler
      CodeUri: functions/driver-summary/
      Events:
        Api:
          Type: Api
          Properties:
            Path: /sessions/{session_key}/drivers/{driver_id}/summary
            Method: GET
        ApiOptions:
          Type: Api
          Properties:
            Path: /sessions/{session_key}/drivers/{driver_id}/summary
            Method: OPTIONS

  DriverLapsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DriverLaps
      Handler: handler.handler
      CodeUri: functions/driver-laps/
      Events:
        Api:
          Type: Api
          Properties:
            Path: /sessions/{session_key}/drivers/{driver_id}/laps
            Method: GET
        ApiOptions:
          Type: Api
          Properties:
            Path: /sessions/{session_key}/drivers/{driver_id}/laps
            Method: OPTIONS

  SimulationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: SimulationDLQ

  SimulationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: SimulationQueue
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SimulationDLQ.Arn
        maxReceiveCount: 3

  StartSimulationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: StartSimulation
      Handler: handler.handler
      CodeUri: functions/start-simulation/
      Environment:
        Variables:
          SQS_ENDPOINT: !Ref SqsEndpoint
          SIMULATION_QUEUE_URL: http://localhost.localstack.cloud:4566/000000000000/SimulationQueue
      Events:
        Api:
          Type: Api
          Properties:
            Path: /start-simulation
            Method: POST
        ApiOptions:
          Type: Api
          Properties:
            Path: /start-simulation
            Method: OPTIONS

  StopSimulationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: StopSimulation
      Handler: handler.handler
      CodeUri: functions/stop-simulation/
      Events:
        Api:
          Type: Api
          Properties:
            Path: /stop-simulation
            Method: POST
        ApiOptions:
          Type: Api
          Properties:
            Path: /stop-simulation
            Method: OPTIONS

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: Login
      Handler: handler.handler
      CodeUri: functions/login/
      Events:
        Api:
          Type: Api
          Properties:
            Path: /login
            Method: POST
        ApiOptions:
          Type: Api
          Properties:
            Path: /login
            Method: OPTIONS

  DriverLiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DriverLive
      Handler: handler.handler
      CodeUri: functions/driver-live/
      Events:
        Api:
          Type: Api
          Properties:
            Path: /sessions/{session_key}/drivers/{driver_id}/live
            Method: GET
        ApiOptions:
          Type: Api
          Properties:
            Path: /sessions/{session_key}/drivers/{driver_id}/live
            Method: OPTIONS

  SimulationLiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SimulationLive
      Handler: handler.handler
      CodeUri: functions/simulation-live/
      Events:
        Api:
          Type: Api
          Properties:
            Path: /sessions/{session_key}/simulation/live
            Method: GET
        ApiOptions:
          Type: Api
          Properties:
            Path: /sessions/{session_key}/simulation/live
            Method: OPTIONS

  SimulationStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SimulationStatus
      Handler: handler.handler
      CodeUri: functions/simulation-status/
      Events:
        Api:
          Type: Api
          Properties:
            Path: /sessions/{session_key}/simulation/status
            Method: GET
        ApiOptions:
          Type: Api
          Properties:
            Path: /sessions/{session_key}/simulation/status
            Method: OPTIONS

Outputs:
  ApiUrl:
    Value: http://localhost:3000
